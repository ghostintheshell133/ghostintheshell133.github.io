<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор стоимости товара</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #44608f, #37507a);
        padding: 20px;
    }

    .card {
        width: 100%;
        max-width: 740px;
        background: #ffffff;
        border-radius: 18px;
        padding: 64px 56px;
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.22);
        text-align: center;
    }

    h1 {
        margin: 0 0 12px;
        font-size: 42px;
        color: #1f2937;
    }

    .subtitle {
        margin: 0 0 38px;
        color: #6b7280;
        font-size: 20px;
    }

    form {
        text-align: left;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 10px;
        font-size: 19px;
        color: #1f2937;
    }

    input[type="text"],
    select {
        width: 100%;
        padding: 18px 20px;
        border: 1px solid #d7dce3;
        border-radius: 8px;
        font-size: 21px;
        margin-bottom: 30px;
        font-family: inherit;
    }

    .field {
        margin-bottom: 30px;
    }

    .field legend {
        font-weight: bold;
        font-size: 19px;
        color: #1f2937;
        padding: 0;
        margin-bottom: 10px;
    }

    .field[hidden] {
        display: none;
    }

    .radio-option,
    .checkbox-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid #d7dce3;
        border-radius: 8px;
        margin-bottom: 10px;
        font-size: 19px;
        cursor: pointer;
    }

    .radio-option:last-child,
    .checkbox-option:last-child {
        margin-bottom: 0;
    }

    .radio-option input,
    .checkbox-option input {
        width: 20px;
        height: 20px;
        accent-color: #44608f;
        flex-shrink: 0;
    }

    #result {
        margin-top: 26px;
        padding: 18px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 20px;
        text-align: center;
    }

    #result:empty {
        display: none;
        padding: 0;
        margin-top: 0;
    }

    #result:not(.error):not(:empty) {
        background-color: #e7f6ec;
        color: #1a7a3c;
    }

    #result.error {
        background-color: #fde8e8;
        color: #c0392b;
    }

    footer {
        margin-top: 20px;
        color: #ffffff;
        font-weight: bold;
        text-align: center;
    }
</style>
<script src="calc.js" defer></script>
</head>
<body>

<main class="card">
    <h1>Калькулятор заказа</h1>
    <p class="subtitle">Стоимость пересчитывается автоматически</p>

    <form id="calc-form">
        <label for="quantity">Количество</label>
        <input type="text" id="quantity" value="1" autocomplete="off">

        <fieldset class="field">
            <legend>Товар</legend>
            <label class="radio-option">
                <input type="radio" name="product" value="keyboard" checked>
                Клавиатура — 2300 ₽
            </label>
            <label class="radio-option">
                <input type="radio" name="product" value="mouse">
                Мышка — 800 ₽
            </label>
            <label class="radio-option">
                <input type="radio" name="product" value="mic">
                Микрофон — 700 ₽
            </label>
        </fieldset>

        <div class="field" id="option-group" hidden>
            <label for="option">Тип мышки</label>
            <select id="option">
                <option value="0">Проводная — +0 ₽</option>
                <option value="400">Беспроводная — +400 ₽</option>
                <option value="800">Игровая (с подсветкой) — +800 ₽</option>
            </select>
        </div>

        <div class="field" id="property-group" hidden>
            <label class="checkbox-option" for="property">
                <input type="checkbox" id="property">
                Расширенная гарантия 2 года — +250 ₽
            </label>
        </div>

        <div id="result" aria-live="polite"></div>
    </form>
</main>

<footer>Семён</footer>

</body>
</html>
